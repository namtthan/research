name: Append daily brief 2026-09-05

on:
  push:
    paths:
      - '.github/workflows/append-daily-2026-09-05.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message == 'Add one-time Sep 5 daily append workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append September 5 briefing
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/daily.json')
          data = json.loads(path.read_text())
          entry = {
            "date": "2026-09-05",
            "stories": [
              {
                "title": "Pelacarsen lowers Lp(a) but fails the cardiovascular-outcome test",
                "takeaway": "A six-year Phase 3 failure shows that moving a biomarker is not enough when the clinical endpoint refuses to cooperate.",
                "what_happened": "Novartis and Ionis reported on September 4 that pelacarsen, an antisense drug targeting lipoprotein(a), failed to significantly reduce major cardiovascular events in a study of more than 8,000 high-risk patients despite lowering Lp(a). Full data are still pending.",
                "why_it_matters": "This is a useful translational-model warning: mechanistic and biomarker readouts only matter if they connect to outcomes that change development decisions. For a career in human-relevant models, the valuable niche is linking molecular changes to clinically meaningful function—not generating prettier surrogates.",
                "caveat": "One drug failure does not invalidate Lp(a) as a target. Depth of lowering, patient selection and drug-specific biology could still matter, and other Lp(a) programs remain in development.",
                "tags": ["Biotech industry", "Clinical trials", "Antisense", "Translational science", "Career"],
                "sources": [{"label": "Reuters", "url": "https://www.reuters.com/business/healthcare-pharmaceuticals/ionis-novartis-key-experimental-heart-drug-fails-late-stage-trial-2026-09-04/"}]
              },
              {
                "title": "A gut microbial metabolite emerges as a causal driver of PSC",
                "takeaway": "Imidazole propionate links dysbiotic gut metabolism to cholangiocyte inflammation and fibrosis through p38–mTORC1 signaling.",
                "what_happened": "A Nature Metabolism study published September 4 found elevated circulating imidazole propionate in primary sclerosing cholangitis, where higher levels predicted worse transplant-free survival. Patient-derived cholangiocyte organoids showed pro-inflammatory and pro-fibrogenic responses, while chronic exposure in mice drove liver inflammation and fibrosis through p38 upstream of mTORC1.",
                "why_it_matters": "This is highly relevant to gut-chip microbiome work because it turns a community-level dysbiosis signal into a testable metabolite–host mechanism. A strong next-step model would expose patient-derived intestinal or hepatobiliary tissues to defined ImP concentrations and ask whether microbiota composition, barrier state or epithelial genotype alters the response.",
                "caveat": "PSC is not Crohn's disease, and the causal in-vivo work is still in mice. Elevated ImP may also reflect broader metabolic ecology rather than one uniquely disease-specific microbial pathway.",
                "tags": ["Gut microbiome", "IBD-related disease", "Metabolites", "Organoids", "Gut–liver axis", "Paper"],
                "sources": [{"label": "Nature Metabolism", "url": "https://www.nature.com/articles/s42255-026-01600-1"}]
              },
              {
                "title": "Magnetic microfluidic rheostats add continuously tunable resistance to chip networks",
                "takeaway": "A new microfluidic component behaves more like an electronic rheostat than an on/off valve, enabling precise local control of hydraulic resistance.",
                "what_happened": "A Microsystems & Nanoengineering paper published September 4 introduced biologically inspired magnetic microfluidic rheostats that continuously tune flow resistance rather than simply opening or closing a channel. The approach is designed for precise and scalable control of flow distribution in complex microfluidic networks.",
                "why_it_matters": "For multiplex organ-chip systems, this is potentially more useful than adding more pumps: local tunable resistance could help balance 1-to-N channel splits, compensate for device-to-device variation and dynamically adjust perfusion without putting a separate actuator on every branch.",
                "caveat": "The paper demonstrates a microfluidic control component, not long-term sterile organ-chip operation. Magnetic actuation, fabrication tolerance, hysteresis and incubator compatibility still need to be proven in biological workflows.",
                "tags": ["Microfluidics", "Organ-on-chip", "Flow control", "Engineering", "Paper"],
                "sources": [{"label": "Microsystems & Nanoengineering", "url": "https://www.nature.com/articles/s41378-026-01430-x"}]
              },
              {
                "title": "Human fluid and flow materially change antibiotic and phage efficacy",
                "takeaway": "A new study shows that treatment performance against UPEC shifts when the bacteria are tested under human urinary chemistry and fluid flow instead of static standard media.",
                "what_happened": "A Nature Communications paper published September 4 examined uropathogenic E. coli under human urinary microenvironment and flow conditions and compared antibiotic and bacteriophage responses. The results show that host-relevant chemistry and hydrodynamics can materially alter therapeutic efficacy relative to simpler culture conditions.",
                "why_it_matters": "The organ-chip lesson is broader than urinary infection: exposure conditions are part of the biology. For gut–microbiome experiments, flow, nutrients, oxygen and host secretions can change whether a microbial intervention appears effective, so static validation may systematically mis-rank candidates.",
                "caveat": "This is a urinary-tract model, not an intestinal system. Whether the magnitude and direction of flow effects translate to gut microbial communities will depend on very different geometry, mucus and ecology.",
                "tags": ["Microfluidics", "Host–microbe", "Phage therapy", "NAMs", "Paper"],
                "sources": [{"label": "Nature Communications", "url": "https://www.nature.com/articles/s41467-026-76589-y"}]
              },
              {
                "title": "Superluminal raises $60M for a milestone-specific Phase 1 push",
                "takeaway": "The Series B is another example of venture money concentrating around programs with a clear near-term clinical readout rather than open-ended platform building.",
                "what_happened": "Superluminal Medicines raised a $60 million Series B reported September 3, with investors including RA Capital, NVIDIA and Eli Lilly. The financing is aimed at advancing its MC4R agonist into Phase 1 for genetic and hypothalamic obesity.",
                "why_it_matters": "For career decisions, the useful signal is where capital is actually going: teams that can state exactly what the next financing round buys—a first-in-human study, a readout or a filing—remain easier to fund and staff than generic discovery platforms.",
                "caveat": "Fierce's tracker only records rounds of at least $50 million, so it overweights visible winners. A $60 million raise also says nothing yet about whether the biology will survive human testing.",
                "tags": ["Biotech industry", "Venture capital", "Funding", "Career", "Clinical development"],
                "sources": [{"label": "Fierce Biotech", "url": "https://www.fiercebiotech.com/biotech/fierce-biotech-fundraising-tracker-26"}]
              }
            ]
          }

          data["briefings"] = [b for b in data.get("briefings", []) if b.get("date") != entry["date"]]
          data["briefings"].append(entry)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily.json
          git commit -m 'Append daily research brief for 2026-09-05'
          git push
